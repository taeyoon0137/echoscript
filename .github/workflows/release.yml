name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release Changesets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YARN_ENABLE_GLOBAL_CACHE: "true"

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select release mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          changeset_file=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit)
          if [[ -n "$changeset_file" ]]; then
            echo "value=version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(jq -er '.version' lerna.json)
          tag="v$version"
          head_sha=$(git rev-parse HEAD)
          tag_sha=$(git rev-list -n 1 "$tag" 2>/dev/null || true)
          tag_subject=$(git log -1 --pretty=%s "$tag" 2>/dev/null || true)

          if [[ -n "$tag_sha" && "$tag_subject" == "$tag" ]] && \
            git merge-base --is-ancestor "$tag_sha" "$head_sha" && \
            ! gh release view "$tag" >/dev/null 2>&1; then
            echo "value=recover" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "value=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up mise
        if: steps.mode.outputs.value == 'version'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14

      - name: Verify mise toolchain
        if: steps.mode.outputs.value == 'version'
        shell: bash
        run: |
          set -euo pipefail
          package_manager=$(jq -er '.packageManager' package.json)

          test "$(mise --version | cut -d ' ' -f 1)" = '2026.8.14'
          test "$(node --version)" = 'v24.15.0'
          test "$(yarn --version)" = '4.18.0'
          test "$package_manager" = "yarn@$(yarn --version)"

      - name: Install dependencies
        if: steps.mode.outputs.value == 'version'
        run: yarn install --immutable --check-cache

      - name: Validate release plan
        if: steps.mode.outputs.value == 'version'
        shell: bash
        run: |
          set -euo pipefail

          status_file="$RUNNER_TEMP/changeset-status.json"
          notes_file="$RUNNER_TEMP/release-notes.md"

          yarn changeset status --output "$status_file"
          jq -e '.releases | length > 0' "$status_file" >/dev/null

          {
            echo '## Changes'
            echo
            jq -r '.changesets[].summary' "$status_file"
          } > "$notes_file"

      - name: Apply release versions
        if: steps.mode.outputs.value == 'version'
        run: yarn release:version

      - name: Verify release state
        if: steps.mode.outputs.value == 'version'
        shell: bash
        run: |
          set -euo pipefail
          yarn install --immutable --check-cache
          yarn ready
          yarn npm audit --all --recursive --no-deprecations
          version=$(jq -er '.version' lerna.json)
          test -s README.md
          grep -F "Current recent version is \`$version\`" README.md
          git diff --check
          test -L CLAUDE.md
          test "$(readlink CLAUDE.md)" = 'AGENTS.md'

      - name: Commit and tag release
        id: commit
        if: steps.mode.outputs.value == 'version'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git

          base_sha=$(git rev-parse HEAD)
          git fetch --no-tags origin 'refs/heads/main:refs/remotes/origin/main'
          remote_sha=$(git rev-parse origin/main)

          if [[ "$base_sha" != "$remote_sha" ]]; then
            echo "main advanced while this release was running; a queued run will process the latest Changesets."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(jq -er '.version' lerna.json)
          tag="v$version"

          for manifest in package.json packages/core/package.json packages/plugin/package.json packages/types/package.json; do
            manifest_version=$(jq -er '.version' "$manifest")
            if [[ "$manifest_version" != "$version" ]]; then
              echo "Version mismatch: $manifest has $manifest_version, expected $version." >&2
              exit 1
            fi
          done

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Refusing to replace existing tag: $tag" >&2
            exit 1
          fi

          git add -A -- \
            .changeset \
            README.md \
            lerna.json \
            package.json \
            yarn.lock \
            packages/core/package.json \
            packages/plugin/package.json \
            packages/types/package.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Changesets did not produce a release commit.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$tag"

          release_sha=$(git rev-parse HEAD)
          git tag "$tag" "$release_sha"
          git push --atomic origin 'HEAD:refs/heads/main' "refs/tags/$tag"

          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.commit.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.commit.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.commit.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "Tag $RELEASE_TAG points to $tag_sha, expected $RELEASE_SHA." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Recover missing GitHub Release
        if: steps.mode.outputs.value == 'recover'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.mode.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
